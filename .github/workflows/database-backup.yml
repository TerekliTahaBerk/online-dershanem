name: Encrypted Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "20 1 * * *"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: restore_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_DIRECT_URL: ${{ secrets.PRODUCTION_DATABASE_DIRECT_URL }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
      RESTORE_DATABASE_URL: postgresql://restore:restore@localhost:5432/restore_drill
    steps:
      - name: Require backup secrets
        run: |
          test -n "$DATABASE_DIRECT_URL"
          test -n "$BACKUP_PASSWORD"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create encrypted dump
        run: |
          pg_dump "$DATABASE_DIRECT_URL" --format=custom --no-owner --no-acl --file=database.dump
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in database.dump -out database.dump.enc -pass env:BACKUP_PASSWORD
          rm database.dump

      - name: Restore backup into disposable database
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in database.dump.enc -out database.verify.dump -pass env:BACKUP_PASSWORD
          pg_restore --list database.verify.dump > /dev/null
          pg_restore --no-owner --no-acl --dbname="$RESTORE_DATABASE_URL" database.verify.dump
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) AS restored_tables FROM information_schema.tables WHERE table_schema='public';"
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) AS users FROM users; SELECT COUNT(*) AS lessons FROM lessons; SELECT COUNT(*) AS orders FROM od_orders; SELECT COUNT(*) AS outbox FROM email_outbox;"
          rm database.verify.dump

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: production-db-${{ github.run_id }}
          path: database.dump.enc
          retention-days: 14
          if-no-files-found: error
