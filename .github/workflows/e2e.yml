name: E2E (Playwright)

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/e2e_test?schema=public
      NEXTAUTH_SECRET: e2e-only-nextauth-secret-0123456789abcdef0123456789abcdef
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PANEL_ENABLED: "true"
      PANEL_FEATURE_LEARNING_OUTCOMES: "true"
      PANEL_FEATURE_MOCK_EXAM_ANALYSIS: "true"
      PANEL_FEATURE_REVIEW_QUEUE: "true"
      PANEL_FEATURE_QUICK_LESSON_CLOSE: "true"
      PANEL_FEATURE_ADAPTIVE_PLAN: "true"
      PANEL_FEATURE_PARENT_WEEKLY_DIGEST: "true"
      PANEL_FEATURE_INTERVENTION_INBOX: "true"
      PANEL_FEATURE_RECOVERY_PACKAGE: "true"
      PANEL_FEATURE_ASSIGNMENT_EVIDENCE: "true"
      PANEL_FEATURE_STUDENT_CHECK_IN: "true"
      PANEL_FEATURE_ACCESSIBILITY_PROFILE: "true"
      PANEL_FEATURE_OFFLINE_MODE: "true"
      PANEL_FEATURE_COHORT_QUALITY: "true"
      PANEL_FEATURE_TEACHER_AI_DRAFTS: "true"
      INSTAGRAM_INTEGRATION_ENABLED: "true"
      META_APP_SECRET: e2e-only-meta-app-secret
      META_VERIFY_TOKEN: e2e-only-meta-verify-token
      META_GRAPH_API_VERSION: v99.0
      PUBLIC_REGISTER_ENABLED: "false"
      ODK_ROLLOUT_MODE: general
      ODK_PILOT_KILL_SWITCH: "false"
      ODK_PILOT_ACCEPTANCE_APPROVED: "true"
      ODK_PILOT_SECURITY_REVIEW_APPROVED: "true"
      ODK_PILOT_OPERATIONS_APPROVED: "true"
      CRON_SECRET: e2e-only-cron-secret-0123456789abcdef0123456789abcdef
      BLOB_READ_WRITE_TOKEN: vercel_blob_rw_e2e_placeholder
      PAYTR_MERCHANT_ID: e2e-merchant
      PAYTR_MERCHANT_KEY: e2e-only-merchant-key
      PAYTR_MERCHANT_SALT: e2e-only-merchant-salt
      OD_PROVISIONING_TEST_MODE: "true"
      ODK_PROVISIONING_TEST_MODE: "true"
      E2E_PASSWORD: testpass123
      PANEL_E2E_ADMIN_EMAIL: admin.e2e@example.com
      PANEL_E2E_ADMIN_PASSWORD: testpass123
      PANEL_E2E_TEACHER_EMAIL: teacher.e2e@example.com
      PANEL_E2E_TEACHER_PASSWORD: testpass123
      PANEL_E2E_STUDENT_EMAIL: student.e2e@example.com
      PANEL_E2E_STUDENT_PASSWORD: testpass123
      PANEL_E2E_PARENT_EMAIL: parent.e2e@example.com
      PANEL_E2E_PARENT_PASSWORD: testpass123
      PANEL_E2E_FOREIGN_STUDENT_ID: e2e-student-profile-foreign
      PANEL_E2E_FOREIGN_LESSON_ID: e2e-lesson-foreign
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_HTML_OPEN: never

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Configure CI restore-drill fixture
        run: |
          echo "PANEL_LAST_RESTORE_DRILL_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "ODK_LAST_RESTORE_DRILL_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Resolve Playwright version
        id: playwright-version
        run: node -p '"version=" + require("@playwright/test/package.json").version' >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prisma migrate
        run: |
          npx prisma generate
          npx prisma db push --skip-generate --accept-data-loss

      - name: Seed E2E users
        run: npx tsx prisma/seed-e2e.ts

      - name: Build Next.js
        run: npm run build:nomigrate

      - name: Run general Playwright tests
        run: npm run e2e -- --shard=${{ matrix.shard }}/3 --grep-invert "integrated pilot rollout|@odk-critical"

      - name: Run pilot rollout tests
        if: ${{ matrix.shard == 1 }}
        env:
          PANEL_ROLLOUT_MODE: pilot
          PANEL_PILOT_KILL_SWITCH: "false"
          PANEL_PILOT_ACCEPTANCE_APPROVED: "true"
          PANEL_PILOT_SECURITY_REVIEW_APPROVED: "true"
        run: |
          npx tsx prisma/seed-e2e.ts
          npm run e2e -- tests/e2e/pilot-rollout.spec.ts --workers=1

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

  odk-critical:
    name: ODK critical (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: odk-desktop-chromium
            browser: chromium
          - project: odk-desktop-webkit
            browser: webkit
          - project: odk-iphone-webkit
            browser: webkit
          - project: odk-android-chromium
            browser: chromium

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/e2e_test?schema=public
      NEXTAUTH_SECRET: e2e-only-nextauth-secret-0123456789abcdef0123456789abcdef
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PANEL_ENABLED: "true"
      ODK_ROLLOUT_MODE: general
      ODK_PILOT_KILL_SWITCH: "false"
      ODK_PILOT_ACCEPTANCE_APPROVED: "true"
      ODK_PILOT_SECURITY_REVIEW_APPROVED: "true"
      ODK_PILOT_OPERATIONS_APPROVED: "true"
      CRON_SECRET: e2e-only-cron-secret-0123456789abcdef
      BLOB_READ_WRITE_TOKEN: vercel_blob_rw_e2e_placeholder
      E2E_PASSWORD: testpass123
      PANEL_E2E_STUDENT_PASSWORD: testpass123
      PLAYWRIGHT_ODK_DEVICE_MATRIX: "true"
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_HTML_OPEN: never

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Configure CI restore-drill fixture
        run: |
          echo "PANEL_LAST_RESTORE_DRILL_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "ODK_LAST_RESTORE_DRILL_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Resolve Playwright version
        id: playwright-version
        run: node -p '"version=" + require("@playwright/test/package.json").version' >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Prepare database
        run: |
          npx prisma generate
          npx prisma db push --skip-generate --accept-data-loss
          npx tsx prisma/seed-e2e.ts

      - name: Build Next.js
        run: npm run build:nomigrate

      - name: Run mandatory ODK flow
        run: npx playwright test tests/e2e/odk-exam-flow.spec.ts --project=${{ matrix.project }} --workers=1

      - name: Upload ODK report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-odk-${{ matrix.project }}
          path: blob-report/
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

      - name: Upload ODK failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-odk-${{ matrix.project }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

  report:
    # Combine shard results into one report status and one HTML artifact.
    name: Playwright Tests
    needs: [e2e, odk-critical]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install report tooling
        run: npm ci --ignore-scripts

      - name: Download shard reports
        id: download-reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge Playwright reports
        id: merge-reports
        if: ${{ steps.download-reports.outcome == 'success' }}
        run: npx playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload Playwright HTML report
        if: ${{ always() && steps.merge-reports.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Enforce Playwright results
        if: ${{ always() && (needs.e2e.result != 'success' || needs.odk-critical.result != 'success') }}
        run: |
          echo "One or more general shards or mandatory ODK browser/device jobs failed. Open the playwright-report artifact for details."
          exit 1
