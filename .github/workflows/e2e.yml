name: E2E (Playwright)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "prisma/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/e2e_test?schema=public
      NEXTAUTH_SECRET: e2e-secret-do-not-use-in-prod
      NEXTAUTH_URL: http://localhost:3000
      E2E_PASSWORD: testpass123
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: node -p '"version=" + require("@playwright/test/package.json").version' >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prisma migrate
        run: |
          npx prisma generate
          npx prisma db push --skip-generate --accept-data-loss

      - name: Seed E2E users
        run: npx tsx prisma/seed-e2e.ts

      - name: Build Next.js
        run: npm run build:nomigrate

      - name: Run Playwright tests
        run: npm run e2e -- --shard=${{ matrix.shard }}/3

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

  report:
    # Bu job adı mevcut branch-protection required check adını korur.
    name: Playwright Tests
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install report tooling
        run: npm ci --ignore-scripts

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Enforce shard results
        if: ${{ needs.e2e.result != 'success' }}
        run: |
          echo "One or more Playwright shards failed. Open the playwright-report artifact for details."
          exit 1
