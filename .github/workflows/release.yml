name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ENV: production
      DATABASE_URL: postgresql://user:pass@localhost:5432/release?schema=public
      DIRECT_URL: postgresql://user:pass@localhost:5432/release?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_SECRET: release-only-nextauth-secret-0123456789abcdef0123456789abcdef
      PANEL_ENABLED: "true"
      CRON_SECRET: release-only-cron-secret-0123456789abcdef0123456789abcdef
      BLOB_READ_WRITE_TOKEN: vercel_blob_rw_release_only
      RESEND_API_KEY: re_release_only
      EMAIL_MODE: receipts
      ODK_ROLLOUT_MODE: general
      ODK_PILOT_KILL_SWITCH: "false"
      ODK_PILOT_ACCEPTANCE_APPROVED: "true"
      ODK_PILOT_SECURITY_REVIEW_APPROVED: "true"
      ODK_PILOT_OPERATIONS_APPROVED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Require tag to match package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run lint:hygiene
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Configure production readiness fixture
        run: echo "ODK_LAST_RESTORE_DRILL_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - run: npm run build

  container:
    name: Publish container
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Normalize image name
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Online Dershanem
            org.opencontainers.image.description=Online Dershanem production application
            org.opencontainers.image.licenses=LicenseRef-Proprietary
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    name: Publish GitHub Release
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Container

            ```bash
            docker pull ${{ needs.container.outputs.image }}:${{ github.ref_name }}
            ```

            Image digest: `${{ needs.container.outputs.digest }}`
