name: PII Inventory

# docs/data-classification-inventory.md şemadan heuristikle üretilir. Şema
# değişip envanter yeniden üretilmediyse bu iş kırılır.
on:
  pull_request:
    paths:
      - "prisma/schema/**"
      - "lib/data-governance/pii-heuristics.mjs"
      - "scripts/generate-pii-inventory.mjs"
      - "docs/data-classification-inventory.md"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/inventory?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inventory matches schema
        run: npm run data:pii-inventory:check
