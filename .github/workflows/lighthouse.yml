name: Lighthouse

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 06:30 Turkey time (03:30 UTC)
    - cron: "30 3 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: Audit production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ENV: production
      DATABASE_URL: postgresql://user:pass@localhost:5432/lighthouse?schema=public
      DIRECT_URL: postgresql://user:pass@localhost:5432/lighthouse?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-nextauth-secret-0123456789abcdef0123456789abcdef
      PANEL_ENABLED: "true"
      CRON_SECRET: ci-only-cron-secret-0123456789abcdef0123456789abcdef
      BLOB_READ_WRITE_TOKEN: vercel_blob_rw_ci_only
      RESEND_API_KEY: re_ci_only
      EMAIL_MODE: receipts
      ODK_ROLLOUT_MODE: general
      ODK_PILOT_KILL_SWITCH: "false"
      ODK_PILOT_ACCEPTANCE_APPROVED: "true"
      ODK_PILOT_SECURITY_REVIEW_APPROVED: "true"
      ODK_PILOT_OPERATIONS_APPROVED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure production readiness fixture
        run: echo "ODK_LAST_RESTORE_DRILL_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build production application
        run: npm run build
      - name: Run Lighthouse CI
        run: npm run lighthouse:ci
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report-${{ github.run_id }}
          path: .lighthouseci/
          retention-days: 30
          if-no-files-found: ignore
