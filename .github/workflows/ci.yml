name: CI

# Kapı `pull_request` üzerinde koşar; `push` bilerek kapalı tutuldu.
#
# Otomatik tetikleyiciler bir dönem tamamen kapatılmıştı ("geliştirme hızını
# düşürüyor"). Sonuç: `main` üzerinde iki birim testi ve bir lint HATASI kimse
# fark etmeden birikti — quality-gate işi tanımlıydı ama hiç çalışmıyordu.
# Yayın kapısı yalnızca koştuğunda kapıdır.
#
# `push` yerine `pull_request`: dal üzerinde çalışırken her commit'te CI
# beklenmiyor, ama `main`'e giren hiçbir değişiklik kapıyı atlayamıyor.
on:
  pull_request:
    branches: [main, test]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reject new high or critical advisories
        run: npm run audit:ci

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Repo hygiene
        run: npm run lint:hygiene
      - name: API input validation
        run: npm run lint:api-validation

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/typecheck?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      # Prisma Client `npm ci` içindeki `postinstall` ile üretilir.
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: Unit tests + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/unit?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Birim testleri tek sefer koşar; coverage `lib/` ile sınırlı ve eşikler
      # (satır 90 / branch 74 / fonksiyon 70) `package.json` içinde. Eşiğin
      # altına düşmek bu işi, dolayısıyla quality-gate'i kırar.
      - run: npm run test:unit:coverage
      - name: Upload unit coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-coverage
          path: coverage/lcov.info
          retention-days: 30
          if-no-files-found: warn
          overwrite: true

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/integration_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/integration_test?schema=public
      BUSINESS_INTEGRATION_TEST: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare integration database
        run: |
          ALLOW_FRESH_DB_BOOTSTRAP=true npm run db:bootstrap:fresh
          npm run db:seed
      - run: npm run test:integration

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ENV: production
      DATABASE_URL: postgresql://user:pass@localhost:5432/build?schema=public
      DIRECT_URL: postgresql://user:pass@localhost:5432/build?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-nextauth-secret-0123456789abcdef0123456789abcdef
      PANEL_ENABLED: "true"
      CRON_SECRET: ci-only-cron-secret-0123456789abcdef0123456789abcdef
      BLOB_READ_WRITE_TOKEN: vercel_blob_rw_ci_only
      MFA_ENCRYPTION_KEY: Y2ktb25seS1tZmEta2V5LTAxMjM0NTY3ODlhYmNkZWY=
      UPSTASH_REDIS_REST_URL: https://ci-cache.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-only-cache-token
      RESEND_API_KEY: re_ci_only
      EMAIL_MODE: receipts
      ODK_ROLLOUT_MODE: general
      ODK_PILOT_KILL_SWITCH: "false"
      ODK_PILOT_ACCEPTANCE_APPROVED: "true"
      ODK_PILOT_SECURITY_REVIEW_APPROVED: "true"
      ODK_PILOT_OPERATIONS_APPROVED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure production readiness fixture
        run: echo "ODK_LAST_RESTORE_DRILL_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - run: npm run build

  fresh-database:
    name: Fresh database bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fresh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fresh_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fresh_test?schema=public
      PSQL_URL: postgresql://postgres:postgres@localhost:5432/fresh_test
      ALLOW_FRESH_DB_BOOTSTRAP: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bootstrap schema from migration SQL
        run: npm run db:bootstrap:fresh
      - name: Verify schema and migration state
        run: |
          npx prisma migrate status
          test "$(psql "$PSQL_URL" -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('users','groups','lessons','assignments','notifications');")" = "5"
          test "$(psql "$PSQL_URL" -Atc "SELECT COUNT(*) FROM business_units WHERE product IN ('OD', 'ODK') AND is_active = true;")" = "2"
          npm run db:verify:fresh
      - name: Verify bootstrap idempotency
        run: npm run db:bootstrap:fresh

  playwright:
    name: Playwright
    uses: ./.github/workflows/e2e.yml

  # Storybook hikâyelerini derler ve her hikâyeyi E2E ile aynı WCAG etiket
  # setiyle axe'tan geçirir (tests/storybook/a11y.spec.ts).
  storybook-a11y:
    name: Storybook a11y
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Storybook
        run: npm run storybook:build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Axe scan all stories
        run: npm run storybook:a11y

  quality-gate:
    name: Quality Gate
    if: ${{ always() }}
    needs:
      - dependency-audit
      - lint
      - typecheck
      - unit
      - integration
      - production-build
      - fresh-database
      - playwright
      - storybook-a11y
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce all required checks
        env:
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BUILD_RESULT: ${{ needs.production-build.result }}
          DATABASE_RESULT: ${{ needs.fresh-database.result }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
          STORYBOOK_A11Y_RESULT: ${{ needs.storybook-a11y.result }}
        run: |
          for result in "$AUDIT_RESULT" "$LINT_RESULT" "$TYPECHECK_RESULT" "$UNIT_RESULT" "$INTEGRATION_RESULT" "$BUILD_RESULT" "$DATABASE_RESULT" "$PLAYWRIGHT_RESULT" "$STORYBOOK_A11Y_RESULT"; do
            test "$result" = "success"
          done
