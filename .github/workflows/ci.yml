name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Validate Prisma schema with DATABASE_URL only
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
        run: npx prisma validate

      - name: Prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm run test:unit
