name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Validate Prisma schema with DATABASE_URL only
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
        run: npx prisma validate

      - name: Prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Repo hygiene (duplicate file guard)
        run: npm run lint:hygiene

      - name: Unit tests
        run: npm run test:unit

  fresh-database:
    name: Fresh database bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fresh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fresh_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fresh_test?schema=public
      PSQL_URL: postgresql://postgres:postgres@localhost:5432/fresh_test
      ALLOW_FRESH_DB_BOOTSTRAP: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bootstrap schema and resolve legacy chain
        run: npm run db:bootstrap:fresh
      - name: Verify schema and migration state
        run: |
          npx prisma migrate status
          test "$(psql "$PSQL_URL" -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('users','groups','lessons','assignments','notifications');")" = "5"
          test "$(psql "$PSQL_URL" -Atc "SELECT COUNT(*) FROM business_units WHERE product IN ('OD', 'ODK') AND is_active = true;")" = "2"
