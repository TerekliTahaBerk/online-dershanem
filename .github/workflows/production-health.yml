name: Production Health

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Check application and database health
        # /api/health readiness sözleşmesini döner: { ready, status, checks }.
        # 503 gövdesi hangi kontrolün kapattığını söyler; --fail onu yuttuğu
        # için gövde dosyaya alınır ve check özetleri iş loguna yazılır.
        run: |
          http_code="$(curl --silent --show-error --retry 2 --retry-all-errors --max-time 20 \
            --output health.json --write-out '%{http_code}' https://www.onlinedershanem.com/api/health || true)"
          echo "HTTP $http_code"
          if jq -e '.checks' health.json >/dev/null 2>&1; then
            jq -r '.checks | to_entries[] | "\(.key): \(.value.status)\(if .value.code then " (" + .value.code + ")" else "" end)"' health.json
            jq -r '.checks.cron.jobs[]? | select(.status != "healthy") | "::warning::cron \(.name): \(.status)"' health.json
          else
            echo "::error::Health yanıtı readiness JSON'u değil."
          fi
          jq -e '.checks.database.status == "ok"' health.json >/dev/null || { echo "::error::Veritabanı erişilemiyor."; exit 1; }
          test "$http_code" = "200" && jq -e '.ready == true' health.json >/dev/null

      # Sağlıklı ama eski bir deploy da "yeşil" görünür. Yayındaki commit'i
      # `main`'in ucuyla karşılaştırıp sapmayı iş özetine yazar. Bir merge'ün
      # deploy'u uçuşta olabilir; ilk sapmada 90 sn bekleyip bir kez tekrar
      # bakıyoruz, ikinci sapma gerçek sapmadır.
      - name: Compare production build with main
        run: |
          EXPECTED_SHA="$(git rev-parse HEAD)"
          export EXPECTED_SHA
          npm run verify:production-version && exit 0
          echo "::notice::Sürüm sapması görüldü; deploy uçuşta olabilir, 90 sn sonra tekrar bakılıyor."
          sleep 90
          npm run verify:production-version
