name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production systems
        env:
          CRON_SECRET: ${{ secrets.PRODUCTION_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing GitHub Actions secret PRODUCTION_CRON_SECRET. Set it to the Vercel production CRON_SECRET value."
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 --max-time 30 -H "Authorization: Bearer $CRON_SECRET" https://www.onlinedershanem.com/api/smoke
