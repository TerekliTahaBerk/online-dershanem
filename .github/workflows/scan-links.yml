name: Broken Link Scan

on:
  workflow_dispatch:
  schedule:
    # Her gün TSİ 06:00 (UTC 03:00)
    - cron: "0 3 * * *"

jobs:
  scan:
    name: Scan public site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BASE_URL: ${{ vars.SCAN_BASE_URL || 'https://onlinedershanem.com' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run link scanner
        run: npm run scan:links

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: broken-links-report
          path: |
            broken-links.json
            broken-links.txt
          retention-days: 30
          if-no-files-found: ignore
