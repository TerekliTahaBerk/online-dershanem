name: Broken Link Scan

on:
  workflow_dispatch:
  schedule:
    # Every day at 06:00 Turkey time (03:00 UTC)
    - cron: "0 3 * * *"

jobs:
  scan:
    name: Scan public site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BASE_URL: ${{ vars.SCAN_BASE_URL || 'https://onlinedershanem.com' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run link scanner
        run: npm run scan:links

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: broken-links-report
          path: |
            broken-links.json
            broken-links.txt
          retention-days: 30
          if-no-files-found: ignore
